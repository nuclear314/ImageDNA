name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t imagedna .

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install
      - run: windows\build.bat
        shell: cmd
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ImageDNA-windows
          path: release/ImageDNA/

  linux-build:
    # Not ubuntu-latest - AppImages built on newer glibc don't run on older
    # distros, so pin an explicit base rather than floating (see
    # LINUX_STANDALONE_BUILD.md's glibc-skew concern). ubuntu-22.04 was tried
    # first for the widest glibc floor, but its gobject-introspection is too
    # old to provide the girepository-2.0 pkg-config module current
    # PyGObject (>=3.51.0) requires to build - see the linux/build.sh patch
    # step's comment for the related runtime-side GLib 2.88 story.
    # ubuntu-24.04 is the oldest runner that has it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GTK/WebKit build + runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-0 libgirepository-2.0-dev pkg-config \
            fuse libfuse2
      - run: npm install
      - run: chmod +x linux/build.sh && linux/build.sh
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ImageDNA-linux
          path: release/ImageDNA-x86_64.AppImage
