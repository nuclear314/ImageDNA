# Flatpak manifest for ImageDNA — replaces the linux/ PyInstaller+AppImage
# pipeline (see the plan/commit history this replaced). The core reason for
# this migration: the AppImage build deliberately did not bundle GTK3/GLib/
# WebKit2GTK/girepository (treating them as system prerequisites, to avoid a
# frozen GTK talking to a mismatched host WebKit), but its *compiled*
# PyGObject C extension was still built once, on the CI machine, against
# that machine's girepository headers — producing subtly-wrong argument
# marshaling on end-user systems with a sufficiently different
# gobject-introspection version (confirmed on Artix Linux / GLib 2.88.2),
# in a way that couldn't be fixed by bundling (breaks typelib discovery
# instead, typelib search paths are themselves distro-filesystem-convention-
# dependent) or by further CI base-image bumps (just moves the gap).
#
# Flatpak avoids this class of bug structurally: the GNOME runtime below
# ships a matched, tested GTK3/GLib/WebKit2GTK/girepository set that the app
# always runs against, regardless of the end user's host distro.
app-id: io.github.nuclear314.ImageDNA
runtime: org.gnome.Platform
# VERIFY at implementation/build time: `flatpak remote-ls flathub | grep
# org.gnome.Platform` — GNOME 50.1 was the current stable Flathub runtime as
# of this manifest being written (GNOME 48 went EOL 2026-03-24), but confirm
# nothing newer stable has shipped since.
runtime-version: '50'
sdk: org.gnome.Sdk
command: imagedna

finish-args:
  # HF Hub downloads (tagger model, GGUF/mmproj captioning models) and the
  # koboldcpp binary's own GitHub Releases download — see
  # joycaptioner_kobold.py's ensure_artifacts().
  - --share=network
  # Conventionally paired with X11 socket access for GTK apps.
  - --share=ipc
  # Wayland preferred, X11 fallback only when Wayland isn't available — the
  # current Flathub-preferred pattern over a bare --socket=x11. VERIFY
  # against current Flathub docs at build time, this convention shifts.
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access — needed both for WebKitGTK's own compositing and for
  # koboldcpp's --usevulkan launch (joycaptioner_kobold.py has NO CPU
  # fallback for Step 2 captioning). --device=dri is the least-privilege
  # starting point; NVIDIA proprietary-driver passthrough in particular is
  # UNVERIFIED — see the GPU/Vulkan verification note in the project plan
  # before treating Step 2 as working under Flatpak. Escalate to
  # --device=all only if hands-on testing on real hardware shows dri isn't
  # enough, don't add it preemptively.
  - --device=dri
  # Deliberately NO --filesystem= grant: XDG_DATA_HOME is auto-redirected
  # under Flatpak to ~/.var/app/io.github.nuclear314.ImageDNA/data, so
  # flatpak/main.py's HF_HOME/IMAGEDNA_KOBOLD_HOME/webview-storage logic
  # (identical to linux/main.py's) needs zero code changes and lands there
  # transparently — a real simplification versus the old pipeline's custom
  # data-dir plumbing.
  #
  # File-picker access (uploading images to tag) is expected to route
  # through WebKitGTK's native org.freedesktop.portal.FileChooser
  # integration rather than needing a broad --filesystem=host grant here —
  # this has NOT been hands-on confirmed (this repo has never run WebKitGTK
  # inside a portal-mediated sandbox before). Verify during first real build
  # and add a scoped --filesystem= grant only if the portal path doesn't
  # work as expected, rather than assuming it's needed upfront.

modules:
  # Generated by flatpak/generate-pip-modules.sh from
  # requirements-flatpak.txt. This is itself a complete module definition
  # (flatpak-builder supports a bare filename string in `modules:` as a
  # reference to an external module file) — checked into git like a
  # lockfile since flatpak-builder's sandboxed build has no network access
  # to resolve pip packages fresh.
  - python3-requirements.json

  - name: imagedna
    buildsystem: simple
    build-commands:
      - install -d /app/lib/imagedna
      - cp -r dist /app/lib/imagedna/dist
      - install -m644 server.py tagger.py joycaptioner.py joycaptioner_kobold.py -t /app/lib/imagedna/
      - install -m644 flatpak/main.py /app/lib/imagedna/main.py
      - install -Dm755 flatpak/imagedna-wrapper.sh /app/bin/imagedna
      - install -Dm644 flatpak/io.github.nuclear314.ImageDNA.desktop /app/share/applications/io.github.nuclear314.ImageDNA.desktop
      - install -Dm644 flatpak/io.github.nuclear314.ImageDNA.metainfo.xml /app/share/metainfo/io.github.nuclear314.ImageDNA.metainfo.xml
      # VERIFY assets/icon.png's actual pixel dimensions before relying on
      # this path — installed under a hicolor size directory that must
      # match its real size for icon-theme lookup to work correctly.
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/512x512/apps/io.github.nuclear314.ImageDNA.png
    sources:
      # dist/ must already exist (built via `npm run build` outside the
      # sandbox — no Node.js SDK extension here, matching linux/build.sh
      # step 1's approach) before running flatpak-builder against this
      # manifest. The CI job (flatpak-build) runs `npm run build` as a
      # separate step immediately before this, same as the old linux-build
      # job did for the AppImage's frontend bundle.
      - type: dir
        path: ..
